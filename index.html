
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>码鉴 AI - 代码人才评估</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-primary: #2D5BFF;
        --brand-secondary: #00C896;
        --brand-accent: #FF6B35;
        --brand-dark: #1A1A2E;
        --brand-light: #F5F7FA;
      }
      body {
        font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        background-color: var(--brand-dark);
        color: #f9fafb;
        font-size: 16px;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        font-weight: 700;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bento-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .bento-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
